<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento recebido · Karen & Paulo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a1208;color:#faf7f2;font-family:Jost,sans-serif;text-align:center;padding:24px}
    main{max-width:620px}h1{font-family:"Cormorant Garamond",serif;color:#c9a84c;font-size:48px;font-weight:400;margin:0 0 16px}p{line-height:1.8;color:#e8d5a3}a{display:inline-block;margin-top:22px;border:1px solid #c9a84c;color:#1a1208;background:#c9a84c;text-decoration:none;padding:12px 22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
  </style>
</head>
<body>
  <main>
    <h1 id="title">Confirmando pagamento</h1>
    <p id="message">Estamos verificando a confirmação segura do Stripe.</p>
    <a href="/">Voltar ao site</a>
  </main>
  <script>
    async function verify(){
      const sessionId = new URLSearchParams(location.search).get('session_id');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      if(!sessionId){
        title.textContent = 'Pagamento não localizado';
        message.textContent = 'Não recebemos o identificador do checkout. Confira o painel administrativo ou tente novamente.';
        return;
      }
      try{
        const res = await fetch('/api/verify-session?session_id=' + encodeURIComponent(sessionId));
        const data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Não foi possível verificar.');
        if(data.paid){
          title.textContent = 'Presente confirmado';
          message.textContent = 'Obrigado pelo carinho. O pagamento foi confirmado e registrado para os noivos.';
        }else{
          title.textContent = 'Pagamento em processamento';
          message.textContent = 'O Stripe ainda não marcou o pagamento como concluído. O painel será atualizado assim que a confirmação chegar.';
        }
      }catch(error){
        title.textContent = 'Erro na confirmação';
        message.textContent = error.message || 'Não foi possível confirmar agora.';
      }
    }
    verify();
  </script>
</body>
</html>
