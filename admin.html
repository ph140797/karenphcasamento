<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Karen & Paulo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#c9a84c;--dark:#1a1208;--cream:#faf7f2;--line:#e8dcc8;--muted:#6c5b3b}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:Jost,sans-serif}
    header{background:var(--dark);color:#fff;padding:24px clamp(18px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    h1{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:400;margin:0;color:var(--gold)}
    main{max-width:1120px;margin:0 auto;padding:28px clamp(18px,4vw,48px) 56px}
    .login,.summary,.table-wrap{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:18px}
    .auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px}
    .auth-title{font-family:"Cormorant Garamond",serif;font-size:38px;font-weight:400;margin:0 0 18px;color:var(--gold)}
    .admin-shell[hidden],.auth-screen[hidden]{display:none}
    label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    input{width:100%;border:1px solid var(--line);padding:12px;font:inherit}
    input[type="checkbox"]{width:auto;transform:scale(1.2)}
    button{border:0;background:var(--gold);color:var(--dark);font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:12px 16px;cursor:pointer}
    .login-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .metric{border-left:2px solid var(--gold);padding-left:12px}.metric b{display:block;font-size:24px}.metric span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
    table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
    .items{max-width:340px}.status{font-weight:700;color:var(--gold)}.error{color:#9b1c1c;margin-top:10px}.muted{color:var(--muted)}
    h2{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:400;margin:0 0 12px;color:var(--dark)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .gift-form{display:grid;grid-template-columns:1.2fr 1.4fr .7fr .5fr auto;gap:10px;align-items:end;margin-bottom:12px}
    .gift-thumb{width:72px;height:54px;object-fit:cover;border:1px solid var(--line);background:var(--cream)}
    .ghost{background:#fff;border:1px solid var(--gold)}
    @media (max-width:760px){.login-row,.summary,.gift-form{grid-template-columns:1fr}.table-wrap{overflow-x:auto}table{min-width:920px}}
  </style>
</head>
<body>
  <section class="auth-screen" id="loginScreen">
    <div class="auth-card">
      <h1 class="auth-title">Admin de Presentes</h1>
      <div class="login-row">
        <div>
          <label for="token">Admin token</label>
          <input id="token" type="password" autocomplete="current-password" placeholder="Cole o ADMIN_TOKEN do Netlify">
        </div>
        <button id="saveTokenBtn">Entrar</button>
      </div>
      <p id="error" class="error"></p>
    </div>
  </section>
  <div class="admin-shell" id="adminShell" hidden>
    <header>
      <h1>Admin de Presentes</h1>
      <button id="refreshBtn">Atualizar</button>
    </header>
    <main>
    <p id="adminStatus" class="error"></p>
    <section class="summary">
      <div class="metric"><b id="paidTotal">R$ 0,00</b><span>Total pago</span></div>
      <div class="metric"><b id="paidCount">0</b><span>Pagamentos</span></div>
      <div class="metric"><b id="pendingCount">0</b><span>Pendentes</span></div>
      <div class="metric"><b id="guestCount">0</b><span>Convidados</span></div>
    </section>
    <section class="table-wrap">
      <h2>Presentes</h2>
      <table>
        <thead><tr><th>Data</th><th>Status</th><th>Método</th><th>Cliente</th><th>Valor</th><th>Presentes</th><th>Ações</th></tr></thead>
        <tbody id="orders"><tr><td colspan="7" class="muted">Informe o token para carregar.</td></tr></tbody>
      </table>
    </section>
    <section class="table-wrap">
      <div class="section-head">
        <h2>Presenças</h2>
        <button id="exportRsvpsBtn">Exportar CSV</button>
      </div>
      <table>
        <thead><tr><th>Data</th><th>Nome</th><th>WhatsApp</th><th>Pessoas</th><th>Acompanhantes</th></tr></thead>
        <tbody id="rsvps"><tr><td colspan="5" class="muted">Informe o token para carregar.</td></tr></tbody>
      </table>
    </section>
    </main>
  </div>
  <script>
    const fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    const tokenInput = document.getElementById('token');
    const errorEl = document.getElementById('error');
    const adminStatusEl = document.getElementById('adminStatus');
    const loginScreen = document.getElementById('loginScreen');
    const adminShell = document.getElementById('adminShell');
    let rsvpList = [];
    tokenInput.value = localStorage.getItem('weddingAdminToken') || '';

    function setMessage(message){
      errorEl.textContent = message;
      adminStatusEl.textContent = message;
    }
    function money(cents){ return fmt.format((Number(cents) || 0) / 100); }
    function itemText(items){ return (items || []).map((item) => item.name).join(', '); }
    function setAuthenticated(){
      loginScreen.hidden = true;
      adminShell.hidden = false;
    }
    async function validateToken(){
      const token = tokenInput.value.trim();
      if(!token){ setMessage('Informe o ADMIN_TOKEN.'); return false; }
      const res = await fetch('/api/admin-auth', { headers: { Authorization: `Bearer ${token}` } });
      if(!res.ok){ setMessage('Token inválido.'); return false; }
      localStorage.setItem('weddingAdminToken', token);
      setAuthenticated();
      setMessage('');
      await loadOrders();
      return true;
    }
    async function markOrderPaid(id){
      const token = tokenInput.value.trim();
      if(!token){ setMessage('Informe o ADMIN_TOKEN.'); return; }
      const res = await fetch('/api/admin-orders', {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${token}`, 'content-type': 'application/json' },
        body: JSON.stringify({ id, status: 'paid' })
      });
      const data = await res.json();
      if(!res.ok){ setMessage(data.error || 'Não foi possível confirmar pagamento.'); return; }
      setMessage('Pagamento confirmado.');
      loadOrders();
    }

    async function loadOrders(){
      const token = tokenInput.value.trim();
      if(!token){ setMessage('Informe o ADMIN_TOKEN.'); return; }
      setMessage('');
      const [ordersRes, rsvpsRes] = await Promise.all([
        fetch('/api/admin-orders', { headers: { Authorization: `Bearer ${token}` } }),
        fetch('/api/admin-rsvps', { headers: { Authorization: `Bearer ${token}` } })
      ]);
      const ordersData = await ordersRes.json();
      const rsvpsData = await rsvpsRes.json();
      if(!ordersRes.ok){ setMessage(ordersData.error || 'Não foi possível carregar presentes.'); return; }
      if(!rsvpsRes.ok){ setMessage(rsvpsData.error || 'Não foi possível carregar presenças.'); return; }
      const orders = ordersData.orders || [];
      const rsvps = rsvpsData.rsvps || [];
      rsvpList = rsvps;
      const paid = orders.filter((order) => order.status === 'paid');
      document.getElementById('paidTotal').textContent = money(paid.reduce((sum, order) => sum + Number(order.amount_total || 0), 0));
      document.getElementById('paidCount').textContent = paid.length;
      document.getElementById('pendingCount').textContent = orders.filter((order) => order.status !== 'paid').length;
      document.getElementById('guestCount').textContent = rsvps.reduce((sum, rsvp) => sum + Number(rsvp.guest_count || 1), 0);
      document.getElementById('orders').innerHTML = orders.length ? orders.map((order) => `
        <tr>
          <td>${new Date(order.created_at || order.updated_at).toLocaleString('pt-BR')}</td>
          <td class="status">${order.status}</td>
          <td>${order.payment_method || ''}</td>
          <td>${order.customer_name || ''}<br><span class="muted">${order.customer_email || ''}</span></td>
          <td>${money(order.amount_total)}</td>
          <td class="items">${itemText(order.items)}</td>
          <td>${order.status === 'pix_pending' ? `<button class="ghost" onclick="markOrderPaid('${order.id}')">Marcar pago</button>` : ''}</td>
        </tr>
      `).join('') : '<tr><td colspan="7" class="muted">Nenhum pedido ainda.</td></tr>';
      document.getElementById('rsvps').innerHTML = rsvps.length ? rsvps.map((rsvp) => `
        <tr>
          <td>${new Date(rsvp.created_at || rsvp.updated_at).toLocaleString('pt-BR')}</td>
          <td>${rsvp.name || ''}</td>
          <td>${rsvp.phone || ''}</td>
          <td>${rsvp.guest_count || 1}</td>
          <td class="items">${(rsvp.guests || []).slice(1).join(', ')}</td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="muted">Nenhuma presença confirmada ainda.</td></tr>';
    }

    function csvCell(value){
      let text = String(value ?? '').replace(/\r?\n/g, ' ').trim();
      if(/^[=+\-@]/.test(text)) text = `'${text}`;
      return `"${text.replace(/"/g, '""')}"`;
    }

    function exportRsvpsCsv(){
      if(!rsvpList.length){ setMessage('Não há confirmações para exportar.'); return; }
      const headers = ['Código da pessoa','Nome','Tipo','Código do convidado principal','Convidado principal','WhatsApp do convidado','Data da confirmação','Total no grupo','Mensagem'];
      const rows = [headers];
      let nextPersonCode = 1;
      rsvpList.forEach((rsvp) => {
        const guestCode = nextPersonCode++;
        const date = new Date(rsvp.created_at || rsvp.updated_at).toLocaleString('pt-BR');
        const guests = Array.isArray(rsvp.guests) && rsvp.guests.length ? rsvp.guests : [rsvp.name];
        rows.push([guestCode, rsvp.name, 'Convidado', '', rsvp.name, rsvp.phone || '', date, rsvp.guest_count || guests.length, rsvp.message || '']);
        guests.slice(1).forEach((companion) => {
          rows.push([nextPersonCode++, companion, 'Acompanhante', guestCode, rsvp.name, rsvp.phone || '', date, rsvp.guest_count || guests.length, rsvp.message || '']);
        });
      });
      const csv = '\uFEFF' + rows.map(row => row.map(csvCell).join(';')).join('\r\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = `lista-confirmados-${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setMessage('CSV de confirmações exportado com sucesso.');
    }

    document.getElementById('saveTokenBtn').addEventListener('click', validateToken);
    tokenInput.addEventListener('keydown', (event) => { if(event.key === 'Enter') validateToken(); });
    document.getElementById('refreshBtn').addEventListener('click', loadOrders);
    document.getElementById('exportRsvpsBtn').addEventListener('click', exportRsvpsCsv);
  </script>
</body>
</html>
