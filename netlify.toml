[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # ASAAS_ENV só guarda o nome do ambiente da Asaas (sandbox/production), não é segredo.
  # Sem isso o scanner da Netlify falha o deploy ao achar o valor em .env.example e README.
  SECRETS_SCAN_OMIT_KEYS = "ASAAS_ENV"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
